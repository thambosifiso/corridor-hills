<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Corridor Hills | Proof of Submission</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <style>
    /* print-friendly */
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      .card { box-shadow: none !important; border: 1px solid #ddd !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" id="receiptCard">
      <h1>Proof of Submission</h1>
      <p class="muted">Keep this as proof. If requested, present it at the reception.</p>

      <div class="grid">
        <div><label>Date</label><div id="r_date" class="pill"></div></div>
        <div><label>Ticket</label><div id="r_ticket" class="pill"></div></div>
      </div>

      <div class="grid" style="margin-top:12px;">
        <div><label>Student Number</label><div id="r_student" class="pill"></div></div>
        <div><label>Status</label><div id="r_status" class="pill"></div></div>
      </div>

      <div class="grid" style="margin-top:12px;">
        <div><label>Names</label><div id="r_first" class="pill"></div></div>
        <div><label>Surname</label><div id="r_last" class="pill"></div></div>
      </div>

      <div class="grid" style="margin-top:12px;">
        <div><label>Room Number</label><div id="r_room" class="pill"></div></div>
        <div><label>Cellphone</label><div id="r_cell" class="pill"></div></div>
      </div>

      <div style="margin-top:14px;">
        <label>Issue Encountered</label>
        <div id="r_issue" class="note" style="min-height:60px;"></div>
      </div>

      <div class="note" style="margin-top:14px;">
        <b>Office hours:</b> 8am – 4pm
      </div>

      <div class="row no-print" style="margin-top:14px;">
        <button class="btn primary" id="printBtn">Print / Save as PDF</button>
        <a class="btn ghost" href="./check.html">Check Status</a>
        <a class="btn ghost" href="./student.html">Back</a>
      </div>
    </main>

    <footer class="footer muted no-print">© Corridor Hills</footer>
  </div>

  <script>
    // Load receipt data saved from student.js
    const raw = localStorage.getItem("ch_receipt");
    if (!raw) {
      document.body.innerHTML = "<p style='padding:20px'>No receipt found. Please submit an issue first.</p>";
    } else {
      const r = JSON.parse(raw);

      document.getElementById("r_date").textContent = r.date || "";
      document.getElementById("r_ticket").textContent = r.ticket || "";
      document.getElementById("r_student").textContent = r.studentNumber || "";
      document.getElementById("r_status").textContent = r.status || "";
      document.getElementById("r_first").textContent = r.firstName || "";
      document.getElementById("r_last").textContent = r.lastName || "";
      document.getElementById("r_room").textContent = r.roomNumber || "";
      document.getElementById("r_cell").textContent = r.cellphone || "";
      document.getElementById("r_issue").textContent = r.issue || "";

      document.getElementById("printBtn").addEventListener("click", () => window.print());

      // Auto-open print dialog after a short delay
      setTimeout(() => window.print(), 600);
    }
  </script>
</body>
</html>
